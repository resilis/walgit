name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-web:
    name: Format and web
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt
          rustup default 1.97.1
          rustc --version | grep -F 'rustc 1.97.1'

      - name: Install pnpm
        uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1
        with:
          version: 10.10.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.0
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Check Rust format
        run: cargo fmt --all -- --check

      - name: Build web assets
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web run build

      - name: Upload web assets for Rust compilation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: web-dist-${{ github.sha }}
          path: web/dist/
          if-no-files-found: error
          retention-days: 1

  rust-tests:
    name: Rust workspace tests and e2e
    needs: static-web
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: -D warnings
    steps:
      - name: Verify Git version
        shell: bash
        run: |
          set -euo pipefail
          git --version
          required_git=2.46
          installed_git="$(git version | awk '{print $3}')"
          if [ "$(printf '%s\n' "$required_git" "$installed_git" | sort -V | head -n 1)" != "$required_git" ]; then
            echo "::error::Git ${required_git} or newer is required; found ${installed_git}"
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Download web assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: web-dist-${{ github.sha }}
          path: web/dist

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev
          protoc --version
          test -f /usr/include/google/protobuf/timestamp.proto

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          rustc --version | grep -F 'rustc 1.97.1'

      - name: Run single-fingerprint Rust gate
        run: bash scripts/ci.sh

  container-image:
    name: Container image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      IMAGE: walgit:ci-${{ github.sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Build the release image locally
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          context: .
          file: Containerfile
          load: true
          push: false
          tags: ${{ env.IMAGE }}
          build-args: WALGIT_BUILD_SHA=${{ github.sha }}
          sbom: false
          provenance: false

      - name: Verify runtime tools
        run: >-
          docker run --rm --entrypoint /bin/sh "${IMAGE}" -c
          'command -v walgit && command -v walgit-server && git --version && git-lfs version'

  quality:
    name: Format, web, tests, and e2e
    needs:
      - static-web
      - rust-tests
      - container-image
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Require every quality gate
        env:
          STATIC_WEB_RESULT: ${{ needs.static-web.result }}
          RUST_TESTS_RESULT: ${{ needs.rust-tests.result }}
          CONTAINER_IMAGE_RESULT: ${{ needs.container-image.result }}
        run: |
          set -euo pipefail
          if [ "$STATIC_WEB_RESULT" != success ] || [ "$RUST_TESTS_RESULT" != success ] || [ "$CONTAINER_IMAGE_RESULT" != success ]; then
            echo "::error::Required quality gates did not all succeed"
            exit 1
          fi

  dependency-audit:
    name: Dependency security audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2

      - name: Audit locked Rust dependencies
        run: cargo audit --deny warnings --no-yanked

  s3-contract:
    name: Disposable RustFS S3 contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      rustfs:
        image: rustfs/rustfs@sha256:41fe89380f4120a337790c02af192c3fe7bb55c3edc2e6e9357b487b47c6ab21
        ports:
          - 9000:9000
        env:
          RUSTFS_ACCESS_KEY: walgit-dev
          RUSTFS_SECRET_KEY: walgit-dev-secret
          RUSTFS_ADDRESS: 0.0.0.0:9000
          RUSTFS_VOLUMES: /data
        options: >-
          --health-cmd "curl -sf http://127.0.0.1:9000/minio/health/live"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      CARGO_INCREMENTAL: "0"
      S3_BUCKET: walgit-ci-${{ github.run_id }}-${{ github.run_attempt }}
      WALGIT_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      WALGIT_TEST_S3_REGION: us-east-1
      WALGIT_TEST_S3_FORCE_PATH_STYLE: "true"
      WALGIT_TEST_S3_PREFIX: contract-${{ github.sha }}
      WALGIT_TEST_S3_CREDENTIAL_MODE: explicit
      WALGIT_TEST_S3_ACCESS_KEY_ENV: WALGIT_CI_S3_ACCESS_KEY_ID
      WALGIT_TEST_S3_SECRET_KEY_ENV: WALGIT_CI_S3_SECRET_ACCESS_KEY
      WALGIT_CI_S3_ACCESS_KEY_ID: walgit-dev
      WALGIT_CI_S3_SECRET_ACCESS_KEY: walgit-dev-secret
      AWS_ACCESS_KEY_ID: walgit-dev
      AWS_SECRET_ACCESS_KEY: walgit-dev-secret
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev
          protoc --version
          test -f /usr/include/google/protobuf/timestamp.proto

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1

      - name: Create unique disposable bucket
        run: |
          docker run --rm --network host \
            -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION \
            amazon/aws-cli@sha256:6a1305a37e63914356f9d1808f3349c06a650cbd6e7c777f5dc4b44d630d6b39 \
            --endpoint-url "${WALGIT_TEST_S3_ENDPOINT}" \
            s3api create-bucket --bucket "${S3_BUCKET}"
          docker run --rm --network host \
            -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION \
            amazon/aws-cli@sha256:6a1305a37e63914356f9d1808f3349c06a650cbd6e7c777f5dc4b44d630d6b39 \
            --endpoint-url "${WALGIT_TEST_S3_ENDPOINT}" \
            s3api put-bucket-versioning --bucket "${S3_BUCKET}" \
            --versioning-configuration Status=Enabled

      - name: Run S3 contract
        env:
          WALGIT_TEST_S3_BUCKET: ${{ env.S3_BUCKET }}
        run: cargo test --profile ci --locked -p walgit-store --test contract -- s3_contract --nocapture

      - name: Always clean disposable bucket and multipart uploads
        if: ${{ always() }}
        run: |
          docker run --rm --network host --entrypoint sh \
            -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION \
            -e S3_BUCKET -e WALGIT_TEST_S3_ENDPOINT \
            amazon/aws-cli@sha256:6a1305a37e63914356f9d1808f3349c06a650cbd6e7c777f5dc4b44d630d6b39 \
            -c '
              set -eu
              for query in "Versions[].[Key,VersionId]" "DeleteMarkers[].[Key,VersionId]"; do
                aws --endpoint-url "$WALGIT_TEST_S3_ENDPOINT" s3api list-object-versions \
                  --bucket "$S3_BUCKET" --query "$query" --output text > /tmp/walgit-versions
                while IFS="$(printf "\t")" read -r key version_id; do
                    [ -n "$key" ] && [ "$key" != "None" ] || continue
                    [ -n "$version_id" ] && [ "$version_id" != "None" ]
                    aws --endpoint-url "$WALGIT_TEST_S3_ENDPOINT" s3api delete-object \
                      --bucket "$S3_BUCKET" --key "$key" --version-id "$version_id"
                done < /tmp/walgit-versions
              done
              aws --endpoint-url "$WALGIT_TEST_S3_ENDPOINT" s3api list-multipart-uploads \
                --bucket "$S3_BUCKET" --query "Uploads[].[Key,UploadId]" --output text > /tmp/walgit-uploads
              while IFS="$(printf "\t")" read -r key upload_id; do
                  [ -n "$key" ] && [ "$key" != "None" ] || continue
                  [ -n "$upload_id" ] && [ "$upload_id" != "None" ]
                  aws --endpoint-url "$WALGIT_TEST_S3_ENDPOINT" s3api abort-multipart-upload \
                    --bucket "$S3_BUCKET" --key "$key" --upload-id "$upload_id"
              done < /tmp/walgit-uploads
              versions="$(aws --endpoint-url "$WALGIT_TEST_S3_ENDPOINT" s3api list-object-versions \
                --bucket "$S3_BUCKET" --query "Versions[].VersionId" --output text)"
              markers="$(aws --endpoint-url "$WALGIT_TEST_S3_ENDPOINT" s3api list-object-versions \
                --bucket "$S3_BUCKET" --query "DeleteMarkers[].VersionId" --output text)"
              uploads="$(aws --endpoint-url "$WALGIT_TEST_S3_ENDPOINT" s3api list-multipart-uploads \
                --bucket "$S3_BUCKET" --query "Uploads[].UploadId" --output text)"
              [ -z "$versions" ] || [ "$versions" = "None" ]
              [ -z "$markers" ] || [ "$markers" = "None" ]
              [ -z "$uploads" ] || [ "$uploads" = "None" ]
              aws --endpoint-url "$WALGIT_TEST_S3_ENDPOINT" s3api delete-bucket \
                --bucket "$S3_BUCKET"
            '
